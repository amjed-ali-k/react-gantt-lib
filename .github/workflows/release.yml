name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test
      - run: npm run build

      # `dist/` is gitignored on `main`, so a plain git ref installs a package with no entry points.
      # This tag points at a detached commit that adds the built `dist/` on top of the release, so
      # consumers can install from git without npm:
      #   bun add github:amjed-ali-k/react-gantt-lib#build/vX.Y.Z
      # Consumers' lockfiles pin this tag's commit, so it is never moved or deleted: a re-run of
      # this workflow leaves an existing build tag alone.
      - name: Push the git-installable build tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/build/${VERSION}" >/dev/null; then
            echo "build/${VERSION} already exists; leaving it as is"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A tag push already checks out a detached HEAD, so this commit lands on no branch.
          git add --force dist
          git commit -m "build: ${VERSION} with dist/ (installable from git)"
          git tag "build/${VERSION}"
          git push origin "build/${VERSION}"

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            node scripts/release-notes.mjs --from "$PREV_TAG" --to "$VERSION" --version "$VERSION" --out RELEASE_NOTES.md
          else
            node scripts/release-notes.mjs --to "$VERSION" --version "$VERSION" --out RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      # Before the npm publish, so a registry failure cannot cost the release its notes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
