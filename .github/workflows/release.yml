name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            node scripts/release-notes.mjs --from "$PREV_TAG" --to "$VERSION" --version "$VERSION" --out RELEASE_NOTES.md
          else
            node scripts/release-notes.mjs --to "$VERSION" --version "$VERSION" --out RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
